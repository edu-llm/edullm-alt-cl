[project]
name = "edullm-alt-cl"
version = "0.1.0"
description = "Math front-load + end anneal curriculum for OLMo2-370M / RegMix-10B"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.4",
  "boto3>=1.34",
  "ai2-olmo-core>=2.1",
  "edullm-data @ git+https://github.com/edu-llm/edullm-data@v0.6.3",
]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
